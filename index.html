<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG - TP TypeScript</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            width: 320px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        button {
            background-color: #6200ee;
            color: white;
            border: none;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        button:hover { background-color: #7b1fa2; }
        .log {
            margin-top: 15px;
            background: #000;
            padding: 10px;
            border-radius: 5px;
            height: 70px;
            overflow-y: auto;
            text-align: left;
            font-size: 0.85rem;
            color: #03dac6;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2 id="nombre-pj">Guerrero</h2>
        <p>❤️ Vida: <span id="vida">100</span></p>
        <p>⚔️ Arma: <span id="arma">Espada de fuego</span></p>
        <p>✨ Habilidad: <span id="habilidad">Curación</span></p>

        <button id="btn-atacar">Atacar</button>
        <button id="btn-habilidad">Usar Habilidad</button>
        <button id="btn-cambiar">Cambiar Arma (Arco)</button>

        <div class="log" id="log">Juego listo...</div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
